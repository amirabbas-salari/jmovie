[build]
  command = "npm run build"
  publish = "dist"

# هدرهای امنیتی همه‌ی صفحات: جلوگیری از clickjacking و MIME-sniffing،
# محدودکردن ارجاع‌دهنده و دسترسی‌های مرورگر، و CSP که بارگذاری اسکریپت
# را به همان دامنه محدود می‌کند (دفاع لایه‌ای کنار ذخیره‌ی توکن در
# localStorage). connect-src/img-src روی https باز مانده چون آدرس
# بک‌اند و تصاویر TMDB دامنه‌های متنوعی دارند.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "application/javascript"

[[headers]]
  for = "/*.mjs"
  [headers.values]
    Content-Type = "application/javascript"

[[headers]]
  for = "/*.css"
  [headers.values]
    Content-Type = "text/css"

# خروجی‌های هش‌دار Vite تغییرناپذیرند: کش یک‌ساله immutable
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/avatar.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/camera.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# HTML همیشه تازه تا به چانک‌های جدید اشاره کند
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200